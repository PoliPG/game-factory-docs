<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AD%3C/text%3E%3C/svg%3E"
    />
    <title>Game Factory Docs — Visualizador de materiales y recetas</title>
    <meta
      name="description"
      content="Visualizador de nodos para el arbol de materiales, recetas y maquinas de un juego de automatizacion."
    />
  </head>
  <body>
    <!--
      El contenido de #root es un marcador de posicion: React lo sustituye al
      montar. Si se queda visible, el HTML llego pero el JavaScript no.
    -->
    <div id="root">
      <div
        style="
          display: grid;
          place-items: center;
          height: 100vh;
          margin: 0;
          background: #070b11;
          color: #8fa3b8;
          font: 14px/1.6 system-ui, sans-serif;
          text-align: center;
        "
      >
        <div>
          <p style="font-size: 32px; margin: 0 0 8px">🏭</p>
          <p style="margin: 0">Cargando el arbol de produccion…</p>
          <noscript>
            <p style="color: #f87171">
              Esta pagina necesita JavaScript para dibujar el grafo.
            </p>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Red de seguridad para la pagina publicada. Si el navegador reutiliza un
      // index.html cacheado que apunta a un bundle ya borrado, el script da 404
      // y el aviso de carga se queda fijo. Aqui se detecta y se recarga una
      // sola vez saltandose la cache.
      (function () {
        var RELOAD_FLAG = 'gfd:recarga-por-cache';

        function recargarSinCache(motivo) {
          if (sessionStorage.getItem(RELOAD_FLAG)) {
            mostrarError(motivo);
            return;
          }
          sessionStorage.setItem(RELOAD_FLAG, '1');
          location.replace(location.pathname + '?v=' + Date.now());
        }

        function mostrarError(motivo) {
          var root = document.getElementById('root');
          if (!root || root.dataset.mounted === '1') return;
          root.innerHTML =
            '<div style="display:grid;place-items:center;height:100vh;background:#070b11;' +
            'color:#e6edf5;font:14px/1.6 system-ui,sans-serif;text-align:center;padding:24px">' +
            '<div><p style="font-size:32px;margin:0 0 8px">🕳️</p>' +
            '<p style="margin:0 0 6px">No se pudo cargar la aplicacion.</p>' +
            '<p style="margin:0;color:#8fa3b8;font-size:12px">' +
            String(motivo).replace(/</g, '&lt;') +
            '</p></div></div>';
        }

        // Un recurso (el bundle o la hoja de estilos) que no llega a cargar.
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              recargarSinCache('No se pudo descargar ' + (el.src || el.href));
            }
          },
          true,
        );

        // Cinturon y tirantes: si pasados unos segundos nada ha montado, se
        // asume el mismo problema.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.dataset.mounted !== '1') {
              recargarSinCache('La aplicacion no arranco.');
            }
          }, 6000);
        });
      })();
    </script>
  </body>
</html>
