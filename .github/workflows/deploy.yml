name: Deploy a GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no se cancela el que ya esta en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Comprueba tipos y genera dist/. Se ejecuta en cualquier rama y en los
      # pull requests, asi un fallo de compilacion se detecta antes de mezclar.
      - name: Compilar
        run: npm run build

      # No hace falta actions/configure-pages: vite.config.ts usa base relativa
      # ('./'), asi que el sitio funciona en cualquier ruta sin conocer la URL
      # de Pages durante la compilacion.
      - name: Subir artefacto
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    # Publica unicamente la rama por defecto del repositorio: al renombrarla o
    # al mezclar en main, el despliegue sigue apuntando al sitio correcto.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
